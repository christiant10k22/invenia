spring.application.name=inventai-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:inventai_db}
spring.datasource.username=${POSTGRES_USER:inventai}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080